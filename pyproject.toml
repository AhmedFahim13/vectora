[project]
name = "vectora"
version = "0.1.0"
description = "DSE market intelligence system (research tool, not investment advice)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "duckdb>=1.0",
    "polars>=1.10",
    "pyarrow>=17.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vectora"]

[dependency-groups]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
