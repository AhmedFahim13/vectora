name: eod-pipeline

on:
  schedule:
    # 15:30 Dhaka (UTC+6, no DST) = 09:30 UTC, Sun-Thu trading days.
    # The calendar module skips holidays; cron only filters weekends.
    - cron: "30 9 * * 0,1,2,3,4"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (default: gap-fill up to today, Dhaka)"
        required: false
        default: ""

concurrency:
  group: pipeline-writes
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Dhaka

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Run EOD pipeline
        id: pipeline
        # continue-on-error so a red day still commits its raw evidence and
        # no_trade_days marker; the last step re-surfaces the failure
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            uv run python -m vectora run eod --date "${{ github.event.inputs.date }}"
          else
            uv run python -m vectora run eod
          fi
      - name: Events
        continue-on-error: true
        run: uv run python -m vectora run events
      - name: Regime
        continue-on-error: true
        run: uv run python -m vectora run regime
      - name: Zscan
        continue-on-error: true
        run: uv run python -m vectora run zscan
      - name: Predict
        id: predict
        continue-on-error: true
        run: uv run python -m vectora run predict
      - name: Outcomes
        continue-on-error: true
        run: uv run python -m vectora run outcomes
      - name: Vault
        continue-on-error: true
        run: uv run python -m vectora run vault
      - name: Digest
        continue-on-error: true
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: uv run python -m vectora run digest
      - name: Commit data
        if: always()
        run: |
          git config user.name "vectora-bot"
          git config user.email "vectora-bot@users.noreply.github.com"
          # commit BEFORE pull: a dirty tracked file (the DuckDB) makes
          # `git pull --rebase` exit 128 before even checking freshness
          git add -f data/raw data/vectora.duckdb data/reference vault reports
          git diff --cached --quiet || git commit -m "data: eod $(date +%F)"
          git pull --rebase --autostash
          git push
      - name: Surface pipeline failure
        if: steps.pipeline.outcome == 'failure' || steps.predict.outcome == 'failure'
        run: |
          echo "pipeline or predict exited non-zero"
          exit 1
