name: train

on:
  schedule:
    # Friday 16:00 Dhaka = 10:00 UTC; market closed, weekly retrain (spec §17.5)
    - cron: "0 10 * * 5"
  workflow_dispatch:
    inputs:
      target:
        description: "Label target, e.g. g5_h10"
        required: false
        default: "g5_h10"

concurrency:
  group: pipeline-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Train
        id: train
        continue-on-error: true
        run: uv run python -m vectora run train --target "${{ github.event.inputs.target || 'g5_h10' }}"
      - name: Train g10_h30
        continue-on-error: true
        run: uv run python -m vectora run train --target g10_h30
      - name: Evaluate
        continue-on-error: true
        run: uv run python -m vectora run evaluate
      - name: Backtest
        if: always()
        run: |
          # profitability after costs, beside Brier. A better-calibrated
          # model that loses money is not a better model.
          uv run python -m vectora run backtest

      - name: Commit artifacts
        if: always()
        run: |
          git config user.name "vectora-bot"
          git config user.email "vectora-bot@users.noreply.github.com"
          git add -f models reports data/vectora.duckdb data/state
          git diff --cached --quiet || git commit -m "train: ${{ github.event.inputs.target }} $(TZ=Asia/Dhaka date +%F)"
          git pull --rebase --autostash
          git push
      - name: Surface training failure
        if: steps.train.outcome == 'failure'
        run: exit 1
